<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="婚宴接待">
<meta name="theme-color" content="#E7F1F2">
<title>Shany &amp; Orange 婚宴接待系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F1F2; --surface:#FFFFFF; --surface2:#F3F9F9; --tint:#D8E9EC;
  --line:#D3E4E6; --line2:#B4D0D4;
  --ink:#10353C; --ink2:#3B646D; --muted:#79979E; --dim:#9BB6BB;
  --aqua:#2C8194; --aqua-d:#1B6273; --aqua-l:#DEEEF1;
  --k1:#A98443; --k1bg:#F7F1E3; --k1l:#EBDFC4;   /* 卡柏蒂 */
  --k2:#B0603A; --k2bg:#FAEDE5; --k2l:#F0D5C4;   /* 卡柏蒂＋赫拉大 */
  --k3:#6E9AD0; --k3bg:#EBF2FB; --k3l:#D3E2F4;   /* 赫拉小 */
  --k4:#1E6B7A; --k4bg:#E0EEF1; --k4l:#C4DEE4;   /* 赫拉大 */
  --ok:#2A8474; --okbg:#E2F2EF; --warn:#B9713F; --warnbg:#FAEFE6;
  --ivory:#F6F1E6;
  --r:16px;
  --serif:"Noto Serif TC",serif;
  --disp:"Cormorant Garamond","Noto Serif TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55;
  font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:inherit}

.screen{position:fixed;inset:0;z-index:100;background:var(--bg);padding:26px 20px;overflow-y:auto;display:none}
.screen.on{display:block}
.brandmark{text-align:center;margin:7vh 0 2.6rem}
.brandmark h1{font-family:var(--disp);font-size:29px;font-weight:400;margin:0;
  letter-spacing:.34em;text-indent:.34em;color:var(--ink);white-space:nowrap}
.rule{width:52px;height:1px;background:var(--line2);margin:20px auto}
.brandmark .sub{font-size:12.5px;letter-spacing:.42em;text-indent:.42em;color:var(--muted)}
.brandmark .date{font-family:var(--disp);font-size:14.5px;letter-spacing:.3em;text-indent:.3em;
  color:var(--dim);margin-top:26px}
#gate{background:linear-gradient(180deg,#F2F8F8 0%,var(--bg) 42%,#DEEDEE 100%)}
.gatebox{max-width:400px;margin:0 auto}
.gatebox p{color:var(--muted);font-size:15px;line-height:1.9;text-align:center;margin:0 0 20px}
.gate-in{width:100%;padding:17px 16px;border-radius:13px;background:var(--surface);border:1px solid var(--line2);
  color:var(--ink);font-size:23.5px;font-weight:700;letter-spacing:.2em;text-align:center;outline:none;text-transform:uppercase}
.gate-in:focus{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-l)}
.gate-err{color:var(--warn);font-size:14.5px;font-weight:500;margin:12px 2px 0;min-height:20px;text-align:center}

.rbtn{display:flex;align-items:center;gap:15px;width:100%;text-align:left;padding:18px 17px;margin-bottom:10px;
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rbtn .num{flex:0 0 36px;height:36px;border-radius:50%;background:var(--aqua-l);color:var(--aqua-d);
  display:flex;align-items:center;justify-content:center;font-weight:500;font-size:17px;font-family:var(--disp)}
.rbtn .t{font-size:19px;font-weight:500;font-family:var(--serif);letter-spacing:.04em}
.rbtn .d{font-size:14px;color:var(--muted);margin-top:1px}
.linkbtn{display:block;width:100%;text-align:center;padding:14px;margin-top:16px;color:var(--dim);
  font-size:14.5px;text-decoration:underline}
.pickhead{font-family:var(--serif);font-size:22.5px;font-weight:500;letter-spacing:.06em;margin:1rem 0 4px}
.pickp{color:var(--muted);font-size:14.5px;margin:0 0 22px}

.top{position:sticky;top:0;z-index:40;background:rgba(234,243,247,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:13px 16px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.05em}
.top .who i{font-style:normal;font-size:12px;color:var(--dim);letter-spacing:.16em}
.net{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--okbg);color:var(--ok);letter-spacing:.04em}
.pendbtn{display:inline-block;margin-top:9px;background:var(--warn);color:#fff;font-size:14px;
  font-weight:700;padding:9px 14px;border-radius:20px}
.net.off{background:var(--warnbg);color:var(--warn)}
.swap{padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink2)}
.wrap{padding:16px 16px 110px}

.sect{font-size:12px;font-weight:500;letter-spacing:.26em;text-indent:.26em;color:var(--dim);margin:0 4px 11px}

/* now-serving */
.now{background:var(--surface);border-radius:20px;border:1px solid var(--line);overflow:hidden;margin-bottom:22px}
.now .strip{height:6px}
.now.k1 .strip{background:var(--k1)} .now.k2 .strip{background:var(--k2)}
.now.k3 .strip{background:var(--k3)} .now.k4 .strip{background:var(--k4)}
.now.plain .strip{background:var(--aqua)}
.now .body{padding:22px 20px 20px;text-align:center}
.nowlabel{font-size:11px;letter-spacing:.34em;text-indent:.34em;color:var(--dim);margin-bottom:15px}
.nowname{font-family:var(--serif);font-size:41.5px;font-weight:500;line-height:1.2;letter-spacing:.06em;word-break:break-all}
.nowmeta{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}
.nowitems{margin-top:18px}
.nowitems .item{display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--serif);font-size:24px;font-weight:500;padding:9px 0}
.nowitems .item+.item{border-top:1px dashed var(--line2)}
.nowitems .item .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
  font-family:var(--sans);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nowitems .dbl{margin-top:10px;background:var(--k2bg);color:var(--k2);border:1px solid var(--k2l);
  border-radius:11px;padding:9px 12px;font-size:14px;font-weight:700}
.badge{padding:5px 13px;border-radius:22px;font-size:14.5px;font-weight:500}
.badge.k1{background:var(--k1bg);color:var(--k1)} .badge.k2{background:var(--k2bg);color:var(--k2)}
.badge.k3{background:var(--k3bg);color:var(--k3)}
.badge.k4{background:var(--k4bg);color:var(--k4)}
.badge.n{background:var(--tint);color:var(--ink2)}
.bigtable{font-family:var(--disp);font-size:83px;font-weight:400;line-height:.9;color:var(--aqua-d);letter-spacing:.01em}
.bigtable small{font-size:21.5px;font-weight:400;color:var(--muted);margin-left:6px}
.act{display:block;width:100%;padding:19px;border-radius:15px;font-size:21.5px;font-weight:500;letter-spacing:.14em;text-indent:.14em;
  background:var(--ok);color:#fff;margin-top:22px}
.act:active{opacity:.85}
.act.sec{background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);font-size:17px;padding:14px;font-weight:500;margin-top:9px}
.nextup{padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2);
  font-size:14px;color:var(--muted);text-align:center}
.nextup b{color:var(--ink2);font-weight:500}
.idle{background:var(--surface);border:1px dashed var(--line2);border-radius:20px;padding:44px 24px;
  text-align:center;color:var(--muted);font-size:15.5px;line-height:2;margin-bottom:20px}
.idle .mk{font-family:var(--disp);font-size:36px;color:var(--line2);display:block;margin-bottom:8px}

/* category / table cards */
.cats{display:grid;gap:10px}
.cat{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.cat .dot{flex:0 0 10px;height:38px;border-radius:6px}
.cat.k1 .dot{background:var(--k1)} .cat.k2 .dot{background:var(--k2)}
.cat.k3 .dot{background:var(--k3)} .cat.k4 .dot{background:var(--k4)}
.cat .nm{flex:1;min-width:0}
.cat .nm b{display:block;font-size:17.5px;font-weight:500}
.cat .nm span{font-size:13.5px;color:var(--muted)}
.cat .ct{text-align:right}
.cat .ct b{font-size:22.5px;font-weight:700}
.cat .ct span{font-size:13.5px;color:var(--muted)}
.mini{height:4px;border-radius:4px;background:var(--tint);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px}
.cat.k1 .mini i{background:var(--k1)} .cat.k2 .mini i{background:var(--k2)}
.cat.k3 .mini i{background:var(--k3)} .cat.k4 .mini i{background:var(--k4)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:9px}
.tcard{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tcard .n{font-family:var(--disp);font-size:29px;font-weight:400;line-height:1}
.tcard .c{font-size:12.5px;color:var(--muted)}
.tcard[data-st="part"]{border-color:var(--k1l);background:var(--k1bg)}
.tcard[data-st="full"]{border-color:#BFE0D3;background:var(--okbg)}
.tcard[data-st="full"] .c{color:var(--ok)}
.tcard[data-st="over"]{border-color:#E0A47C;background:var(--warnbg)}
.tcard[data-st="over"] .n,.tcard[data-st="over"] .c{color:var(--warn)}
.tcard .ov{font-size:10px;font-weight:700;color:var(--warn);letter-spacing:.06em;margin-top:1px}
.badge.ov{background:var(--warnbg);color:var(--warn)}

/* roster */
.rost{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);min-width:0;text-align:left}
.rc .rn{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .pt{display:inline-block;margin-left:6px;background:var(--aqua-l);color:var(--aqua-d);
  font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:20px;vertical-align:1px}
.rc .rs{font-size:12.5px;color:var(--muted);margin-top:2px}
.rc.done{background:var(--surface2);border-color:var(--line);opacity:.5}
.rc.done .rn{text-decoration:line-through;text-decoration-thickness:1px}
.rc.done .rs{color:var(--ok);opacity:1}
.rc.wait{border-color:var(--aqua);background:var(--aqua-l)}

/* search */
.searchwrap{position:relative;margin-bottom:12px}
#q{width:100%;padding:16px 44px 16px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);
  color:var(--ink);font-size:21.5px;font-weight:500;outline:none}
#q:focus{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-l)}
#q::placeholder{color:var(--dim);font-weight:400;font-size:18px}
.clr{position:absolute;right:6px;top:6px;bottom:6px;width:36px;color:var(--dim);font-size:21.5px;display:none}
.clr.on{display:block}
.row{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.row.done{background:var(--surface2)}
.row.done .rname{color:var(--ink2)}
.bar{flex:0 0 7px}
.bar.k1{background:var(--k1)} .bar.k2{background:var(--k2)}
.bar.k3{background:var(--k3)} .bar.k4{background:var(--k4)}
.rowmain{flex:1;padding:12px 14px;min-width:0}
.rname{font-size:20px;font-weight:500}
.rmeta{font-size:13.5px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{padding:1px 7px;border-radius:20px;font-size:12px;font-weight:700}
.chip.k1{background:var(--k1bg);color:var(--k1)} .chip.k2{background:var(--k2bg);color:var(--k2)}
.chip.k3{background:var(--k3bg);color:var(--k3)}
.chip.k4{background:var(--k4bg);color:var(--k4)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.nf{background:var(--tint);color:var(--aqua-d)}
.rowgo{flex:0 0 62px;display:flex;align-items:center;justify-content:center;color:var(--dim);
  font-size:21.5px;border-left:1px solid var(--line);text-align:center;line-height:1.25}
.rowgo.edit{background:var(--aqua-l);color:var(--aqua-d);font-size:14px;font-weight:500}
.hint{font-size:13.5px;color:var(--muted);margin:0 4px 10px;line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15.5px;line-height:2}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(18,53,64,.42);z-index:60;display:none}.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg);border-radius:22px 22px 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:10px auto 4px}
.shead{padding:10px 20px 16px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:.04em}
.sbody{padding:18px 20px}
.fieldlabel{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.1em;margin:0 0 8px}
.field{margin-bottom:18px}
.tin{width:100%;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);
  color:var(--ink);font-size:21.5px;font-weight:500;outline:none}
.tin:focus{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-l)}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.amts button{padding:11px 2px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:500}
.seg{display:flex;gap:7px}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg4 button{padding:14px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:500;color:var(--muted);line-height:1.45}
.seg4 button[data-on="1"]{background:var(--aqua-l);border-color:var(--aqua);color:var(--aqua-d);font-weight:700}
.twotag{display:inline-block;margin-left:6px;background:rgba(176,96,58,.14);color:var(--k2);
  font-size:12px;font-weight:700;padding:1px 7px;border-radius:20px;vertical-align:1px}
.seg button{flex:1;padding:12px 4px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  font-size:15px;font-weight:500;color:var(--muted)}
.seg button[data-on="1"]{background:var(--aqua-l);border-color:var(--aqua);color:var(--aqua-d);font-weight:700}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stages button{padding:13px 2px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:500;color:var(--muted)}
.stages button[data-on="1"]{background:var(--aqua);border-color:var(--aqua);color:#fff;font-weight:700}
.big{display:block;width:100%;padding:18px;border-radius:14px;font-size:20px;font-weight:700;margin-top:6px}
.big.go{background:var(--ok);color:#fff}
.big.sec{background:var(--surface);border:1px solid var(--line2);color:var(--ink2);font-size:17px;padding:14px;font-weight:500}
.big.warn{background:var(--warnbg);border:1px solid #E8C0A4;color:var(--warn);font-size:17px;padding:14px;font-weight:500}
.note{font-size:13.5px;color:var(--muted);margin:9px 2px 0;line-height:1.75}

/* dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpis.one{grid-template-columns:1fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.kpi .v{font-family:var(--disp);font-size:42.5px;font-weight:400;margin-top:2px;line-height:1.05}
.kpi .s{font-size:13.5px;color:var(--dim);margin-top:2px}
.track{height:5px;border-radius:5px;background:var(--tint);margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--aqua);border-radius:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.line{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:15.5px}
.line b{font-size:19px;font-weight:700}.line+.line{border-top:1px solid var(--line)}
.callout{border-radius:13px;padding:14px 16px;font-size:15px;line-height:1.7;margin-bottom:12px}
.callout.wait{background:var(--warnbg);color:#8A4A22;border:1px solid #EDCDB4}
.callout.go{background:var(--okbg);color:#1E6B50;border:1px solid #BFE0D3}
.callout.err{background:var(--warnbg);color:#8A4A22;border:1px solid #EDCDB4}
.flow{display:flex;gap:7px}
.fl{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.fl .n{font-family:var(--disp);font-size:33.5px;font-weight:400;line-height:1.1}
.fl .l{font-size:11px;color:var(--muted);margin-top:2px}
.fl[data-hot="1"]{border-color:#E8C0A4;background:var(--warnbg)}
.fl[data-hot="1"] .n{color:var(--warn)}
.util{display:flex;gap:8px;flex-wrap:wrap}
.util button{padding:11px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:500}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,26px);z-index:95;background:var(--ink);color:#fff;
  padding:13px 22px;border-radius:30px;font-size:15.5px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 面板：標題、四宮格、備註 ── */
.panelh{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.04em;margin:0 0 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.g2 .c{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:17px 16px;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.g2 .c .lb{font-size:13px;color:var(--muted);margin-bottom:5px;letter-spacing:.06em}
.g2 .c .vl{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.3;word-break:break-all}
.g2 .c.k1{background:var(--k1bg);border-color:var(--k1l)} .g2 .c.k1 .vl{color:var(--k1)}
.g2 .c.k2{background:var(--k2bg);border-color:var(--k2l)} .g2 .c.k2 .vl{color:var(--k2)}
.g2 .c.k3{background:var(--k3bg);border-color:var(--k3l)} .g2 .c.k3 .vl{color:var(--k3)}
.g2 .c.k4{background:var(--k4bg);border-color:var(--k4l)} .g2 .c.k4 .vl{color:var(--k4)}
.ta{display:block;width:100%;min-height:132px;padding:15px 16px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line2);color:var(--ink);font-size:19px;font-family:inherit;line-height:1.65;
  outline:none;resize:vertical}
.ta:focus{border-color:var(--aqua);box-shadow:0 0 0 3px var(--aqua-l)}
.ta::placeholder{color:var(--dim);font-size:17px}
.notebig{font-size:15px;color:var(--ink2);line-height:1.8;margin:14px 2px 20px}
/* ── 收禮台置頂最近 ── */
.recent{margin-bottom:16px}
.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface2);
  border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:8px}
.rcard .rb{flex:0 0 5px;height:36px;border-radius:4px}
.rcard.k1 .rb{background:var(--k1)} .rcard.k2 .rb{background:var(--k2)}
.rcard.k3 .rb{background:var(--k3)} .rcard.k4 .rb{background:var(--k4)}
.rcard .rt{flex:1;min-width:0}
.rcard .rt b{display:block;font-size:19px;font-weight:500}
.rcard .rt span{font-size:13.5px;color:var(--muted)}
.rcard .re{flex:0 0 auto;background:var(--aqua-l);color:var(--aqua-d);font-size:14px;font-weight:500;
  padding:8px 13px;border-radius:20px}
/* ── 備註通知 ── */
.nitem{display:flex;gap:12px;align-items:flex-start;padding:13px 0}
.nitem+.nitem{border-top:1px solid var(--line)}
.nitem .nb{flex:1;min-width:0}
.nitem .nb b{display:block;font-size:17px;font-weight:500}
.nitem .nb i{font-style:normal;display:block;font-size:15px;color:var(--ink2);margin-top:3px;line-height:1.6}
.nitem .nb em{font-style:normal;font-size:13px;color:var(--muted)}
.nitem button{flex:0 0 auto;background:var(--aqua-l);color:var(--aqua-d);border-radius:20px;
  padding:8px 13px;font-size:13.5px;font-weight:500;align-self:center}
.notebadge{background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:20px;margin-left:8px}
.nitem{width:100%;text-align:left;background:none}
.nitem .ngo{flex:0 0 auto;color:var(--warn);font-size:22px;align-self:center;padding-left:4px}
.notebox{background:var(--surface);border:1px solid var(--line2);border-radius:14px;
  padding:16px;font-size:19px;line-height:1.7;min-height:78px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<div class="screen on" id="gate">
  <div class="brandmark">
    <h1>SHANY &amp; ORANGE</h1>
    <div class="rule"></div>
    <div class="sub">婚宴接待系統</div>
    <div class="date">22 NOVEMBER 2026</div>
  </div>
  <div class="gatebox">
    <p>請輸入總召提供給你的通行碼<br>輸入一次後會記在這支手機裡</p>
    <input class="gate-in" id="code-in" placeholder="通行碼" autocomplete="off" autocorrect="off" spellcheck="false">
    <p class="gate-err" id="code-err"></p>
    <button class="big go" onclick="tryCode()">進入</button>
  </div>
</div>

<div class="screen" id="pick">
  <h1 class="pickhead">選擇你的位置</h1>
  <p class="pickp">選擇今天負責的關卡，隨時可在右上角切換。</p>
  <div id="roleList"></div>
  <button class="linkbtn" onclick="logout()">更換通行碼</button>
</div>

<div class="top" id="top" style="display:none">
  <div class="who"><b id="roleName"></b><i id="roleSub"></i></div>
  <button class="net" id="net" onclick="openOutbox()">連線中</button>
  <button class="swap" onclick="backToPick()">切換</button>
</div>
<div class="wrap" id="wrap"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══ Apps Script 部署網址 ═══ */
var API = "https://script.google.com/macros/s/AKfycbzwC_CfKgAg8XnQCqAut22wnwND1r-SOl5UKOGh4uQWFbJAIivUqddcOExHzTG7WeIw/exec";
/* ════════════════════════════ */

var $=function(s){return document.querySelector(s)}
var WED_TITLE="SHANY & ORANGE";
var ROLES={gF:["收禮台・女方","STATION 1 · 女方","1","登記姓名、紅包編號與金額"],
  gM:["收禮台・男方","STATION 1 · 男方","1","登記姓名、紅包編號與金額"],
  box:["發餅台","STATION 2 · 喜餅","2","依款式發送喜餅"],
  ush:["接待引導","STATION 3 · 入席","3","帶位入席、確認就座"],
  dash:["總覽後台","OVERVIEW","◎","新人與總召使用"]}
var STAGE_NAMES=["未到","待發餅","待入席","已入席"]

var rows=[],rev=-1,role=null,code=""
var perms={roles:[],seeTotals:false,canEnterAmount:false}
/* 共用狀態（這一行缺了會造成 ReferenceError） */
var prevIds=new Set(), audioCtx=null, shellRole=null,
    composing=false, sheetOpen=false, outbox=[], boxQ=""
var boxNames={
  '1':'卡柏蒂 CUPETIT',
  '2':'卡柏蒂 ＋ 赫拉（大）',
  '3':'赫拉（小）',
  '4':'赫拉（大）'}
var boxWho={'1':'女方長輩','2':'女方長輩・雙盒','3':'男方長輩','4':'男方・女方'}
/* 每一組實際要拿幾個盒子，用於訂購數量與發餅提示 */
var boxItems={
  '1':['卡柏蒂 CUPETIT'],
  '2':['卡柏蒂 CUPETIT','赫拉（大）'],
  '3':['赫拉（小）'],
  '4':['赫拉（大）']}
var PRODUCTS=['卡柏蒂 CUPETIT','赫拉（小）','赫拉（大）']
function kWho(k){return boxWho[k]||''}
function kItems(k){return boxItems[k]||[]}
function isDouble(k){return kItems(k).length>1}
function normK(v){
  if(v===undefined||v===null)return ""
  v=String(v).trim()
  if(v==="1"||v==="2"||v==="3"||v==="4")return v
  if(!v)return ""
  var u=v.toUpperCase()
  var hasCup=(v.indexOf("卡")>=0||u.indexOf("CUPETIT")>=0)
  var hasBig=(v.indexOf("大")>=0)
  if(v.indexOf("雙")>=0||(hasCup&&hasBig))return "2"
  if(hasCup)return "1"
  if(v.indexOf("小")>=0)return "3"
  if(hasBig)return "4"
  return ""
}
/* 「喜餅指定」欄有填就以它為準；留空才依方與長輩推導 */
function kOf(p){
  var o=normK(p.boxSet)
  if(o)return o
  if(p.side==="女"&&p.elder)return "1"   // 卡柏蒂
  if(p.side==="男"&&p.elder)return "3"   // 赫拉（小）
  return "4"                              // 赫拉（大）
}
var K_LIST=["1","2","3","4"]
var K_CANON={'1':'卡柏蒂','2':'卡柏蒂+赫拉大','3':'赫拉小','4':'赫拉大'}
function kName(k){return boxNames[k]||("款"+k)}
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byId(id){for(var i=0;i<rows.length;i++)if(rows[i].id===id)return rows[i];return null}
var TABLE_CAP=10
function heads(p){return 1+(Number(p.plus)||0)}
function tableRows(t){return rows.filter(function(p){return p.table===t})}
function tableHeads(t){return headSum(tableRows(t))}
function overTables(){
  var ts=[];rows.forEach(function(p){if(ts.indexOf(p.table)<0)ts.push(p.table)})
  return ts.filter(function(t){return t>0&&tableHeads(t)>TABLE_CAP}).sort(function(a,b){return a-b})
}
function headSum(list){return list.reduce(function(a,p){return a+heads(p)},0)}
function plusTag(p){return (Number(p.plus)||0)>0 ? '＋'+p.plus : ''}

function setNet(s){var e=$("#net")
  e.textContent = s==="ok"?"已同步" : s==="send"?"傳送中" : "離線 "+(outbox.length||"")
  e.classList.toggle("off", s!=="ok"&&s!=="send")}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on")
  clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on")},2200)}
function ping(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)()
    var o=audioCtx.createOscillator(),g=audioCtx.createGain()
    o.connect(g);g.connect(audioCtx.destination);o.frequency.value=784;o.type="sine"
    g.gain.setValueAtTime(.001,audioCtx.currentTime)
    g.gain.exponentialRampToValueAtTime(.2,audioCtx.currentTime+.02)
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.4)
    o.start();o.stop(audioCtx.currentTime+.41)
  }catch(e){}
  if(navigator.vibrate)try{navigator.vibrate([80,60,80])}catch(e){}
}

/* ---------- 通行碼 ---------- */
function checkNotes(){
  try{
    if(!perms.seeTotals)return
    var cur={},fresh=[]
    rows.forEach(function(p){ if(p.note&&p.note.trim()){ cur[p.id]=p.note
      if(noteSeen&&noteSeen[p.id]!==p.note)fresh.push(p) } })
    if(noteSeen&&fresh.length){
      ping()
      toast(fresh.length===1 ? "新備註　"+fresh[0].name+"：" + fresh[0].note.slice(0,14)
                             : "有 "+fresh.length+" 則新備註")
    }
    noteSeen=cur
  }catch(e){ try{console.error("[checkNotes]",e)}catch(_){} }
}
var noteSeen=null
var CACHE_KEY="wedCache_v1", OUTBOX_KEY="wedOutbox_v1", cacheTs=0, fromCache=false
function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY,JSON.stringify({
      rows:rows,rev:rev,perms:perms,ts:Date.now()}))
    cacheTs=Date.now()
  }catch(e){}
}
function loadCache(){
  try{
    var c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null")
    if(!c||!c.rows||!c.rows.length)return false
    rows=c.rows;rev=(c.rev===undefined?-1:c.rev)
    if(c.perms)perms=c.perms
    cacheTs=c.ts||0;fromCache=true
    return true
  }catch(e){return false}
}
function saveOutbox(){
  try{localStorage.setItem(OUTBOX_KEY,JSON.stringify(outbox))}catch(e){}
}
function loadOutbox(){
  try{var o=JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]");if(o&&o.length)outbox=o}catch(e){}
}
function cacheAge(){
  if(!cacheTs)return ""
  var d=new Date(cacheTs)
  return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)
}
function applyPayload(d){
  if(d.rows){rows=d.rows;fromCache=false}
  if(d.rev!==undefined)rev=d.rev
  if(d.roles)perms={roles:d.roles,seeTotals:!!d.seeTotals,canEnterAmount:!!d.canEnterAmount}
  saveCache()
  checkNotes()
}
function tryCode(){
  var v=$("#code-in").value.trim().toUpperCase()
  if(!v){$("#code-err").textContent="請輸入通行碼";return}
  $("#code-err").textContent="驗證中…";code=v
  apiGetRetry(-1,3)
    .then(function(d){
      if(!d||!d.ok){$("#code-err").textContent=(d&&d.error)||"通行碼不正確";code="";return}
      applyPayload(d)
      try{localStorage.setItem("wedCode",code)}catch(e){}
      loadOutbox();failStreak=0
      $("#gate").classList.remove("on");showPicker();startPolling()
    })
    .catch(function(err){
      try{console.error("[login]",err)}catch(e){}
      var net=(err&&(err.name==="AbortError"||err.name==="TypeError"))
      $("#code-err").textContent = net
        ? "伺服器忙線中，請等五秒再按一次進入"
        : "程式發生錯誤：" + ((err&&err.message)||err)
      if(net)code=""
    })
}
function logout(){
  stopPolling()
  try{localStorage.removeItem("wedCode");localStorage.removeItem("wedRole")
      localStorage.removeItem(CACHE_KEY);localStorage.removeItem(OUTBOX_KEY)}catch(e){}
  outbox=[];fromCache=false;cacheTs=0
  code="";role=null;rows=[];rev=-1;failStreak=0;netBusy=false
  $("#top").style.display="none";$("#wrap").innerHTML=""
  $("#pick").classList.remove("on");$("#code-in").value="";$("#code-err").textContent=""
  $("#gate").classList.add("on")
}
function showPicker(){
  $("#roleList").innerHTML=perms.roles.map(function(r){var m=ROLES[r]
    return '<button class="rbtn" onclick="setRole(\''+r+'\')"><span class="num">'+m[2]+'</span>'
      +'<span><span class="t">'+m[0]+'</span><span class="d">'+m[3]+'</span></span></button>'}).join("")
  $("#pick").classList.add("on")
}
function backToPick(){shellRole=null;showPicker()}
function setRole(r){
  if(perms.roles.indexOf(r)<0){toast("你的通行碼沒有這個權限");return}
  role=r;shellRole=null;prevIds=new Set()
  $("#pick").classList.remove("on");$("#top").style.display="flex"
  $("#roleName").textContent=ROLES[r][0];$("#roleSub").textContent=ROLES[r][1]
  try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{localStorage.setItem("wedRole",r)}catch(e){}
  render()
}

/* ---------- 連線 ---------- */
/* ---------- 連線核心（防重疊、逾時、退避） ---------- */
var POLL_BASE=5000, pollTimer=null, pollRunning=false, netBusy=false, failStreak=0
var jitter=Math.floor(Math.random()*1500)

function withTimeout(ms){
  var c=null
  try{ c=new AbortController() }catch(e){}
  var t=setTimeout(function(){ if(c){try{c.abort()}catch(e){}} },ms)
  return {signal:c?c.signal:undefined, done:function(){clearTimeout(t)}}
}
async function apiGet(since,ms){
  var g=withTimeout(ms||12000)
  try{
    var r=await fetch(API+"?code="+encodeURIComponent(code)+"&since="+since,
      {signal:g.signal,cache:"no-store"})
    return await r.json()
  }finally{ g.done() }
}
async function apiPost(body,ms){
  var g=withTimeout(ms||20000)
  try{
    var r=await fetch(API,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(body),signal:g.signal})
    return await r.json()
  }finally{ g.done() }
}
/* 登入用：失敗自動重試，避開四台同時擠進來的瞬間 */
async function apiGetRetry(since,tries){
  tries=tries||3
  var last=null
  for(var i=0;i<tries;i++){
    try{ return await apiGet(since,12000+i*5000) }
    catch(e){
      last=e
      if(i<tries-1)await new Promise(function(r){
        setTimeout(r,1500*(i+1)+Math.floor(Math.random()*1200))})
    }
  }
  throw last
}

async function pull(){
  if(!code||netBusy)return false
  netBusy=true
  try{
    var d=await apiGet(rev)
    if(!d||!d.ok){
      if(d&&d.auth===false){logout();toast("通行碼已失效")}
      failStreak++;setNet("off");return false
    }
    failStreak=0;setNet("ok")
    if(d.same)return false
    applyPayload(d);return true
  }catch(e){failStreak++;setNet("off");return false}
  finally{netBusy=false}
}
async function send(action,optimistic){
  action.code=code
  if(optimistic){optimistic();saveCache()}
  render();setNet("send")
  netBusy=true
  var failed=false
  try{
    var d=await apiPost(action)
    if(!d||!d.ok){failed=true;toast((d&&d.error)||"寫入失敗");setNet("off");return}
    applyPayload(d);failStreak=0;setNet("ok");render();return d
  }catch(e){
    outbox.push(action);saveOutbox();failStreak++;setNet("off")
    toast("已暫存 "+outbox.length+" 筆，連線後自動補送")
  }finally{
    netBusy=false
    if(failed){await pull();render()}
  }
}
/* 補送暫存：成功才移除，伺服器回錯誤不再默默丟掉 */
async function flushOutbox(){
  if(!outbox.length||netBusy)return
  netBusy=true
  var sent=0, kept=[], stopped=false
  try{
    var pending=outbox.slice()
    for(var i=0;i<pending.length;i++){
      var it=pending[i]
      if(stopped){kept.push(it);continue}
      try{
        var d=await apiPost(it)
        if(d&&d.ok){ applyPayload(d); sent++ }
        else{
          it._tries=(it._tries||0)+1
          it._err=(d&&d.error)||"未知錯誤"
          kept.push(it)                      // 伺服器拒絕：保留，不丟棄
        }
      }catch(e){
        kept.push(it); stopped=true           // 連線又斷了：這筆與其後全部留著
      }
    }
    outbox=kept; saveOutbox()
  }finally{ netBusy=false }
  if(sent){ setNet(outbox.length?"off":"ok"); render() }
  if(sent&&!outbox.length) toast("暫存的 "+sent+" 筆已全部補送完成")
  else if(sent&&outbox.length) toast("補送 "+sent+" 筆，還有 "+outbox.length+" 筆未成功")
  else if(outbox.length&&!stopped) toast("有 "+outbox.length+" 筆補送被拒絕，請點「待回傳」查看")
}
/* 檢視待回傳的暫存，可手動重送或放棄 */
function openOutbox(){
  if(!outbox.length){toast("目前沒有待回傳的資料");return}
  $("#sheetIn").innerHTML='<div class="shead"><h2>待回傳資料</h2>'
    +'<div class="rmeta" style="margin-top:6px"><span>共 '+outbox.length+' 筆尚未寫入試算表</span></div></div>'
    +'<div class="sbody">'
    +'<div class="ro">'+outbox.map(function(it){
      var p=byId(it.id)
      var what = it.action==="stage" ? ("改為「"+(STAGE_NAMES[it.stage]||it.stage)+"」")
               : it.action==="checkin" ? "完成收禮"
               : it.action==="note" ? "備註"
               : it.action==="add" ? "新增賓客"
               : it.action
      return '<div class="r"><span>'+esc((p&&p.name)||it.name||("#"+it.id))+'</span>'
        +'<b>'+esc(what)+(it._err?'<br><span style="font-size:13px;color:var(--warn)">'+esc(it._err)+'</span>':'')+'</b></div>'
    }).join("")+'</div>'
    +'<button class="big go" onclick="closeSheet();setTimeout(flushOutbox,200)">立即重送</button>'
    +'<button class="big warn" onclick="dropOutbox()">放棄這些資料</button>'
    +'<p class="note">「放棄」會永久刪除這些尚未寫入的紀錄，只有確定要手動補登時才使用。</p>'
    +'<button class="big sec" onclick="closeSheet()">關閉</button></div>'
  openSheet()
}
function dropOutbox(){
  outbox=[];saveOutbox();closeSheet();render();toast("已清空待回傳資料")
}
function startPolling(){
  if(pollRunning)return          // 防止登出再登入時啟動第二個迴圈
  pollRunning=true
  schedulePoll(POLL_BASE+jitter) // 每台裝置錯開，不會四台同時打
}
function stopPolling(){
  pollRunning=false
  if(pollTimer){clearTimeout(pollTimer);pollTimer=null}
}
function schedulePoll(ms){
  if(pollTimer)clearTimeout(pollTimer)
  pollTimer=setTimeout(pollTick,ms)
}
async function pollTick(){
  if(!code){stopPolling();return}
  // 正在編輯、上一次還沒回來、或畫面在背景 → 這一輪跳過，不堆疊請求
  if(sheetOpen||netBusy||document.hidden){schedulePoll(2500);return}
  await flushOutbox()
  if(await pull())render()
  var wait = failStreak===0
    ? POLL_BASE
    : Math.min(30000, Math.round(POLL_BASE*Math.pow(1.7,failStreak)))
  schedulePoll(wait+Math.floor(Math.random()*900))
}
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&pollRunning){failStreak=0;schedulePoll(400)}
})

function render(){
  if(!role)return
  var w=$("#wrap")
  if(role==="gF"||role==="gM")renderGift(w)
  else{shellRole=null
    if(role==="box")renderBox(w)
    else if(role==="ush")renderUsher(w)
    else renderDash(w)}
}

/* ═══════ 共用：更正面板 ═══════ */
function openFix(id,back){
  var p=byId(id);if(!p)return
  var k=kOf(p)
  window._fixBack=back||null
  $("#sheetIn").innerHTML='<div class="shead"><h2>'+esc(p.name)+'</h2>'
    +'<div class="rmeta" style="margin-top:8px"><span class="chip k'+k+'">'+esc(kName(k))+'</span>'
    +'<span>'+(p.noFee?"免收禮":esc(p.envNo||"尚未收禮"))+'</span>'
    +(p.noFee?'<span class="chip nf">不收紅包</span>':'')+'</div></div>'
    +'<div class="sbody">'
    +'<p class="panelh">賓客資料</p>'
    +'<div class="g2">'
    +'<div class="c"><span class="vl">'+esc(p.name)+'</span></div>'
    +'<div class="c"><span class="vl">第 '+p.table+' 桌</span></div>'
    +'<div class="c"><span class="lb">同行人數</span><span class="vl">'+heads(p)+' 位'
    +((Number(p.plus)||0)>0?'<span style="font-size:15px;color:var(--muted)">（攜伴 '+p.plus+'）</span>':'')+'</span></div>'
    +'<div class="c k'+k+'"><span class="lb">喜餅款式</span><span class="vl">'+esc(kName(k))+'</span></div>'
    +'</div>'

function nextEnvPreview(side){
  var prefix=side==="女"?"F":"M",max=0
  rows.forEach(function(p){
    if(p.envNo&&p.envNo.charAt(0)===prefix){
      var n=parseInt(p.envNo.substring(1),10);if(!isNaN(n)&&n>max)max=n}})
  return prefix+("000"+(max+1)).slice(-3)
}

    bq.addEventListener("compositionstart",function(){composing=true})

    bq.addEventListener("input",function(){if(!composing){boxQ=bq.value;paintBoxSearch()}})
    $("#bclr").onclick=function(){bq.value="";boxQ="";paintBoxSearch();bq.focus()}
  }
  paintBoxSearch()
  prevIds=ids
}
function paintBoxSearch(){
  var box=$("#bres");if(!box)return
  var q=boxQ.trim()
  var cl=$("#bclr");if(cl)cl.classList.toggle("on",!!q)
  if(!q){box.innerHTML="";return}
  var list=rows.filter(function(p){
    return p.name.indexOf(q)>=0||String(p.table)===q
      ||(p.envNo&&p.envNo.toLowerCase().indexOf(q.toLowerCase())>=0)})
  if(!list.length){
    box.innerHTML='<div class="empty">名單上沒有「'+esc(q)+'」<br>'
      +'請用下方「未包禮金者直接領餅」新增</div>';return
  }
  box.innerHTML=list.slice(0,40).map(function(p){
    var k=kOf(p),done=p.stage>=2
    return '<div class="row '+(done?"done":"")+'" onclick="'
      +(done?'openFix('+p.id+')':'gaveBox('+p.id+')')+'">'
      +'<div class="bar k'+k+'"></div><div class="rowmain">'
      +'<div class="rname">'+esc(p.name)+'</div>'
      +'<div class="rmeta"><span class="chip k'+k+'">'+esc(kName(k))+'</span>'
      +(isDouble(k)?'<span class="chip k2">2 盒</span>':'')
      +'<span>第 '+p.table+' 桌</span>'
      +(heads(p)>1?'<span>共 '+heads(p)+' 位</span>':'')
      +(done?'<span class="chip ok">已領取</span>':'')+'</div></div>'
      +'<div class="rowgo'+(done?"":" edit")+'">'+(done?"✎":"發出<br>喜餅")+'</div></div>'}).join("")
}
function openBoxRoster(k){
  var all=rows.filter(function(p){return kOf(p)===k})
  var out=all.filter(function(p){return p.stage>=2}).length
  $("#sheetIn").innerHTML='<div class="shead"><h2>'+esc(kName(k))+'</h2>'
    +'<div class="rmeta" style="margin-top:6px"><span>已發出 '+out+' 盒，尚有 '+(all.length-out)+' 盒未發</span></div></div>'
    +'<div class="sbody"><div class="rost">'
    +all.map(function(p){
      var cls=p.stage>=2?"done":(p.stage===1?"wait":"")
      var st=p.stage>=2?"已領取":(p.stage===1?"待發餅":"未到")
      return '<button class="rc '+cls+'" onclick="openFix('+p.id+',function(){openBoxRoster(\''+k+'\')})">'
        +'<div class="rn">'+esc(p.name)+'</div>'
        +'<div class="rs">'+st+'　'+p.table+'桌</div></button>'}).join("")
    +'</div><p class="note">刪去線代表已領取。點任何一位可查看資料、改進度或加備註。</p>'
    +'<button class="big sec" onclick="closeSheet()">關閉</button></div>'
  openSheet()
}
async function gaveBox(id){
  var p=byId(id);if(!p)return
  if(p.stage>=2){toast(p.name+" 已經領過了");return}
  var nm=p.name
  boxQ=""
  await send({action:"stage",id:id,stage:2},function(){p.stage=2})
  toast(outbox.length?("已記錄 "+nm+"（離線暫存）"):("已發出　"+nm))
}

/* ═══════ STATION 3 接待引導 ═══════ */
function renderUsher(w){
  var q=rows.filter(function(p){return p.stage===2})
  var ids=new Set(q.map(function(p){return p.id})),fresh=false
  ids.forEach(function(i){if(!prevIds.has(i))fresh=true})
  if(prevIds.size&&fresh)ping()
  var cur=q[0],html=offlineBanner()
  if(cur){
    var same=headSum(rows.filter(function(x){return x.table===cur.table&&x.stage===3}))
    html+='<div class="now plain"><div class="strip"></div><div class="body">'
      +'<div class="nowlabel">現在這一位</div>'
      +'<div class="nowname">'+esc(cur.name)+'</div>'
      +'<div style="margin-top:18px"><span class="bigtable">'+cur.table+'<small>桌</small></span></div>'
      +'<div class="nowmeta"><span class="badge n">共 '+heads(cur)+' 位</span>'
      +'<span class="badge n">'+cur.side+'方'+esc(cur.rel)+'</span>'
      +'<span class="badge n">同桌已到 '+same+' / '+tableHeads(cur.table)+' 人</span>'
      +(tableHeads(cur.table)>TABLE_CAP?'<span class="badge ov">此桌超過 '+TABLE_CAP+' 位</span>':'')+'</div>'
      +'<button class="act" onclick="seat('+cur.id+')">確認已入席</button>'
      +'<button class="act sec" onclick="openFix('+cur.id+')">賓客資料與備註</button>'
      +'</div>'
      +(q.length>1?'<div class="nextup">接下來還有 <b>'+(q.length-1)+'</b> 位等待帶位</div>':'')
      +'</div>'
  }else{
    html+='<div class="idle"><span class="mk">✦</span>目前沒有待引導的賓客<br>發餅台完成後會自動出現在這裡</div>'
  }
  var tables=[];rows.forEach(function(p){if(tables.indexOf(p.table)<0)tables.push(p.table)})
  tables.sort(function(a,b){return a-b})
  var seated=headSum(rows.filter(function(p){return p.stage===3}))
  html+='<p class="sect">各桌入席狀況　'+seated+' / '+headSum(rows)+' 人</p><div class="tgrid">'
    +tables.map(function(t){
      var ps=rows.filter(function(p){return p.table===t})
      var a=headSum(ps.filter(function(p){return p.stage===3})),tt=headSum(ps)
      var st=tt>TABLE_CAP?"over":(a===0?"none":a===tt?"full":"part")
      return '<button class="tcard" data-st="'+st+'" onclick="openTableRoster('+t+')">'
        +'<span class="n">'+t+'</span><span class="c">'+a+'/'+tt+'</span>'
        +(tt>TABLE_CAP?'<span class="ov">超額</span>':'')+'</button>'}).join("")
    +'</div>'
  w.innerHTML=html
  prevIds=ids
}
function openTableRoster(t){
  var ps=rows.filter(function(p){return p.table===t})
  var a=headSum(ps.filter(function(p){return p.stage===3})),tt=headSum(ps)
  $("#sheetIn").innerHTML='<div class="shead"><h2>第 '+t+' 桌</h2>'
    +'<div class="rmeta" style="margin-top:6px"><span>已入席 '+a+' / '+tt+' 人</span>'
    +'<span>'+ps.length+' 組賓客</span>'
    +'<span'+(tt>TABLE_CAP?' style="color:var(--warn);font-weight:700"':'')+'>上限 '+TABLE_CAP+' 位</span></div></div>'
    +'<div class="sbody">'
    +(tt>TABLE_CAP?'<div class="callout wait">這一桌含攜伴共 '+tt+' 位，超過上限 '+(tt-TABLE_CAP)
      +' 位。請盡快與總召確認要調到哪一桌。</div>':'')
    +'<div class="rost">'
    +ps.map(function(p){
      var cls=p.stage===3?"done":(p.stage===2?"wait":"")
      var st=p.stage===3?"已入席":STAGE_NAMES[p.stage]
      var pt=plusTag(p)
      return '<button class="rc '+cls+'" onclick="openFix('+p.id+',function(){openTableRoster('+t+')})">'
        +'<div class="rn">'+esc(p.name)+(pt?'<span class="pt">'+pt+'</span>':'')+'</div>'
        +'<div class="rs">'+st+(pt?'　共 '+heads(p)+' 位':'')+'</div></button>'}).join("")
    +'</div><p class="note">名字後面的 ＋N 是攜伴人數。整組一起報到，主賓客劃掉即代表同行者都已入席。</p>'
    +'<button class="big sec" onclick="closeSheet()">關閉</button></div>'
  openSheet()
}
async function seat(id){
  var p=byId(id)
  await send({action:"stage",id:id,stage:3},function(){p.stage=3})
  toast("已入席")
}

/* ═══════ 總覽 ═══════ */
function renderDash(w){
  var tot=rows.length
  if(!tot){w.innerHTML='<div class="callout err">試算表裡還沒有名單。請在「名單」工作表貼上資料，或用選單「婚宴系統 → 填入示範資料」。</div>';return}
  var totH=headSum(rows)
  var arrRows=rows.filter(function(p){return p.stage>0})
  var arr=headSum(arrRows), bags=arrRows.filter(function(p){return !p.noFee}).length
  var noFeeAll=rows.filter(function(p){return p.noFee})
  var seated=headSum(rows.filter(function(p){return p.stage===3}))
  var seatedRows=rows.filter(function(p){return p.stage===3}).length
  var pct=Math.round(arr/totH*100),target=Math.round(totH*.7),need=Math.max(0,target-arr)
  var tables=[];rows.forEach(function(p){if(tables.indexOf(p.table)<0)tables.push(p.table)})
  tables.sort(function(a,b){return a-b})
  var seatedT=tables.filter(function(t){return rows.some(function(p){return p.table===t&&p.stage===3})}).length
  var w1=rows.filter(function(p){return p.stage===1}).length
  var w2=rows.filter(function(p){return p.stage===2}).length
  var maxF=0,maxM=0
  rows.forEach(function(p){if(p.envNo){var n=parseInt(p.envNo.substring(1),10)
    if(!isNaN(n)){if(p.envNo.charAt(0)==="F"&&n>maxF)maxF=n;if(p.envNo.charAt(0)==="M"&&n>maxM)maxM=n}}})

  /* 桌次超額提示 */
  var over=overTables(), overCard=""
  if(over.length){
    overCard='<div class="card" style="border-color:#E8C0A4;background:var(--warnbg)">'
      +'<h3 style="color:var(--warn)">桌次超額<span class="notebadge">'+over.length+'</span></h3>'
      +over.map(function(t){
        var h=tableHeads(t)
        return '<button class="nitem" onclick="openTableRoster('+t+')"><span class="nb">'
          +'<b>第 '+t+' 桌</b><i>含攜伴共 '+h+' 位，超過上限 '+(h-TABLE_CAP)+' 位</i>'
          +'<em>'+tableRows(t).length+' 組賓客</em></span><span class="ngo">›</span></button>'}).join("")
      +'<p class="note" style="color:var(--warn)">每桌上限 '+TABLE_CAP+' 位。點進去可查看該桌名單。</p></div>'
  }

  /* 工作人員備註 */
  var noted=rows.filter(function(p){return p.note&&p.note.trim()})
  var noteCard=""
  if(noted.length){
    noteCard='<div class="card" style="border-color:#E8C0A4;background:var(--warnbg)">'
      +'<h3 style="color:var(--warn)">工作人員備註<span class="notebadge">'+noted.length+'</span></h3>'
      +noted.map(function(p){
        return '<button class="nitem" onclick="openNote('+p.id+')"><span class="nb"><b>'+esc(p.name)+'</b>'
          +'<i>'+esc(p.note)+'</i>'
          +'<em>第 '+p.table+' 桌　'+esc(p.envNo||"未收禮")+'　'+STAGE_NAMES[p.stage]+'</em></span>'
          +'<span class="ngo">›</span></button>'}).join("")
      +'<p class="note" style="color:var(--warn)">點任一則可查看完整資料並標記處理完畢。</p></div>'
  }

  /* 禮金（僅總召與新人看得到） */
  var money=""
  if(perms.seeTotals){
    var sum=rows.filter(function(p){return p.amount!=null}).reduce(function(a,p){return a+p.amount},0)
    var noAmt=rows.filter(function(p){return p.stage>0&&p.amount==null&&!p.noFee}).length
    money='<div class="card"><h3>禮金</h3>'
      +'<div class="line"><span>已登錄金額合計</span><span><b>NT$ '+sum.toLocaleString()+'</b></span></div>'
      +'<div class="line"><span>已收紅包袋數</span><span><b>'+bags+'</b> 袋</span></div>'
      +'<div class="line"><span>女方 F ／ 男方 M 最大號</span><span><b>'+maxF+' / '+maxM+'</b></span></div>'
      +'<div class="line"><span>免收禮賓客</span><span><b>'+noFeeAll.length+'</b> 組・'
      +headSum(noFeeAll)+' 位</span></div>'
      +(noAmt?'<div class="line" style="color:var(--warn)"><span>尚未登錄金額</span><span><b>'+noAmt+'</b> 筆</span></div>':'')
      +'<p class="note">散場前三個數字要一致：登錄筆數、實際紅包袋數、編號最大值。</p></div>'
  }

  /* 喜餅：依族群 + 實際盒數 */
  var prodTot={},prodOut={}
  PRODUCTS.forEach(function(x){prodTot[x]=0;prodOut[x]=0})
  rows.forEach(function(p){
    kItems(kOf(p)).forEach(function(it){
      if(prodTot[it]===undefined){prodTot[it]=0;prodOut[it]=0}
      prodTot[it]++
      if(p.stage>=2)prodOut[it]++
    })
  })
  var boxCard='<div class="card"><h3>喜餅發放・依族群</h3>'
    +K_LIST.map(function(k){
      var all=rows.filter(function(p){return kOf(p)===k})
      var out=all.filter(function(p){return p.stage>=2}).length
      return '<div class="line"><span><b style="color:var(--k'+k+')">●</b> '+esc(kName(k))
        +(isDouble(k)?'<span class="twotag">2 盒</span>':'')
        +'<br><span style="font-size:13px;color:var(--muted)">'+esc(kWho(k))+'</span></span>'
        +'<span><b>'+out+'</b> / '+all.length+' 組</span></div>'}).join("")
    +'</div>'
    +'<div class="card"><h3>實際盒數・訂購用</h3>'
    +PRODUCTS.map(function(x){
      return '<div class="line"><span>'+esc(x)+'</span><span><b>'+prodOut[x]+'</b> / '+prodTot[x]+' 盒</span></div>'}).join("")
    +'<p class="note">這裡是把雙盒那一組拆開後的實際盒數，訂餅就看這三個分母，建議再加一成備品。</p>'
    +'</div>'

  w.innerHTML=overCard+noteCard
    +'<div class="kpis">'
    +'<div class="kpi"><div class="k">已到場人數</div><div class="v">'+arr
    +'<span style="font-size:15px;color:var(--dim)"> / '+totH+'</span></div>'
    +'<div class="s">'+pct+'%　'+bags+' 組</div>'
    +'<div class="track"><i style="width:'+pct+'%"></i></div></div>'
    +'<div class="kpi"><div class="k">已入席桌數</div><div class="v">'+seatedT
    +'<span style="font-size:15px;color:var(--dim)"> / '+tables.length+'</span></div>'
    +'<div class="s">已就座 '+seated+' 人</div></div></div>'
    +'<div class="callout '+(need?"wait":"go")+'">'
    +(need?'距離 70% 開席目標（約 '+target+' 人）還差 <b>'+need+'</b> 人。'
        :'已達 70% 開席目標，可請司儀準備開席。')+'</div>'
    +'<div class="card"><h3>三關流程狀況</h3><div class="flow">'
    +'<div class="fl"><div class="n">'+bags+'</div><div class="l">① 已收禮</div></div>'
    +'<div class="fl" data-hot="'+(w1>3?1:0)+'"><div class="n">'+w1+'</div><div class="l">待發餅</div></div>'
    +'<div class="fl" data-hot="'+(w2>3?1:0)+'"><div class="n">'+w2+'</div><div class="l">待入席</div></div>'
    +'<div class="fl"><div class="n">'+seatedRows+'</div><div class="l">③ 已就座</div></div></div>'
    +'<p class="note">中間兩格持續大於 3，代表那一關塞住了，需要調人手。</p></div>'
    +boxCard+money
    +'<div class="card"><h3>桌位</h3><div class="tgrid">'
    +tables.map(function(t){
      var ps=rows.filter(function(p){return p.table===t})
      var a=headSum(ps.filter(function(p){return p.stage===3})),tt2=headSum(ps)
      var st=tt2>TABLE_CAP?"over":(a===0?"none":a===tt2?"full":"part")
      return '<button class="tcard" data-st="'+st+'" onclick="openTableRoster('+t+')">'
        +'<span class="n">'+t+'</span><span class="c">'+a+'/'+tt2+'</span>'
        +(tt2>TABLE_CAP?'<span class="ov">超額</span>':'')+'</button>'}).join("")
    +'</div></div>'
    +(perms.seeTotals?'<div class="card"><h3>資料</h3><div class="util">'
      +'<button onclick="exportCSV()">匯出 CSV</button></div>'
      +'<p class="note">完整資料隨時在 Google 試算表裡，這裡只是備份用。</p></div>':'')
}
function openNote(id){
  var p=byId(id);if(!p)return
  var k=kOf(p)
  $("#sheetIn").innerHTML='<div class="shead"><h2>'+esc(p.name)+'</h2>'
    +'<div class="rmeta" style="margin-top:8px"><span class="chip k'+k+'">'+esc(kName(k))+'</span>'
    +'<span>'+(p.noFee?"免收禮":esc(p.envNo||"尚未收禮"))+'</span><span>'+STAGE_NAMES[p.stage]+'</span></div></div>'
    +'<div class="sbody">'
    +'<p class="panelh">賓客資料</p>'
    +'<div class="g2">'
    +'<div class="c"><span class="vl">'+esc(p.name)+'</span></div>'
    +'<div class="c"><span class="vl">第 '+p.table+' 桌</span></div>'
    +'<div class="c"><span class="lb">同行人數</span><span class="vl">'+heads(p)+' 位'
    +((Number(p.plus)||0)>0?'<span style="font-size:15px;color:var(--muted)">（攜伴 '+p.plus+'）</span>':'')+'</span></div>'

    +'尚未處理完成請先關閉，備註會保留。</p>'
    +'<button class="big go" onclick="clearNote('+id+')">標記為已處理</button>'

    +'<button class="big sec" onclick="closeSheet()">先不處理，關閉</button>'

}
async function clearNote(id){
  closeSheet()
  await send({action:"note",id:id,note:""},function(){var p=byId(id);if(p)p.note=""})
  toast("已標記處理完畢")
}
function exportCSV(){
  var head=["編號","姓名","方","關係","桌次","攜伴","喜餅款式","狀態","金額","備註","不收禮"]
  var body=rows.map(function(p){
    return [p.envNo,p.name,p.side,p.rel,p.table,Number(p.plus)||0,kName(kOf(p)),
      STAGE_NAMES[p.stage],p.amount==null?"":p.amount,(p.note||"").replace(/,/g,"、"),p.noFee?"是":""].join(",")})
  var csv="\ufeff"+[head.join(",")].concat(body).join("\n")
  var a=document.createElement("a")
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}))
  a.download="婚宴名單.csv";a.click();toast("已匯出 CSV")
}

function openSheet(){sheetOpen=true;$("#scrim").classList.add("on");$("#sheet").classList.add("on")}
function closeSheet(){sheetOpen=false;$("#scrim").classList.remove("on");$("#sheet").classList.remove("on")}
$("#scrim").onclick=closeSheet
$("#code-in").addEventListener("keydown",function(e){if(e.key==="Enter")tryCode()})

;(function(){
  var saved=null,savedRole=null
  try{saved=localStorage.getItem("wedCode");savedRole=localStorage.getItem("wedRole")}catch(e){}
  if(!saved)return
  code=saved
  loadOutbox()
  // 先用本機快取把畫面打開，即使完全連不上也能作業
  if(loadCache()){
    $("#gate").classList.remove("on")
    if(savedRole&&perms.roles.indexOf(savedRole)>=0)setRole(savedRole)
    else showPicker()
    setNet("off")
    startPolling()
  }else{
    $("#code-err").textContent="連線中…"
  }
  apiGetRetry(-1,4)
    .then(function(d){
      if(!d||!d.ok){
        if(!fromCache){code="";$("#code-err").textContent=(d&&d.error)||""}
        return
      }
      applyPayload(d);failStreak=0;setNet("ok")
      if($("#gate").classList.contains("on")){
        $("#gate").classList.remove("on")
        if(savedRole&&perms.roles.indexOf(savedRole)>=0)setRole(savedRole)
        else showPicker()
      }else{ render() }
      startPolling()
    })
    .catch(function(err){
      try{console.error("[autologin]",err)}catch(e){}
      if(fromCache){ setNet("off"); return }   // 已用快取開起來，繼續離線作業
      var net=(err&&(err.name==="AbortError"||err.name==="TypeError"))
      $("#code-err").textContent = net
        ? "伺服器忙線中，請按下方進入重試"
        : "程式發生錯誤：" + ((err&&err.message)||err)
      $("#code-in").value=saved
    })
})()
